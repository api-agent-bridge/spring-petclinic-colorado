# Mock mode: the external services are answered by a local server with recorded responses.
# Start it with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mock
# The recordings are in src/main/resources/mock-upstreams

petclinic.mock.port=9091
petclinic.mock.url=http://localhost:${petclinic.mock.port}
spring.http.serviceclient.denver.base-url=${petclinic.mock.url}/denver/arcgis/rest/services
spring.http.serviceclient.census.base-url=${petclinic.mock.url}/census/geocoder
petclinic.upstream.cdphe.animals-url=${petclinic.mock.url}/cdphe/arcgis/services/DCEED/ZOONOTIC_SUMMARY_POSITIVE_ANIMALS_2017/MapServer
petclinic.upstream.cdphe.cases-url=${petclinic.mock.url}/cdphe/arcgis/services/OPEN_DATA/cdphe_reportable_disease_dataset/MapServer
petclinic.upstream.nws.url=${petclinic.mock.url}/nws
petclinic.upstream.awdb.url=${petclinic.mock.url}/awdb
petclinic.upstream.inaturalist.url=${petclinic.mock.url}/inat
petclinic.upstream.nps.url=${petclinic.mock.url}/nps
petclinic.upstream.dwr.url=${petclinic.mock.url}/dwr/Rest/GET
spring.http.serviceclient.colorado.base-url=${petclinic.mock.url}/colorado
spring.http.serviceclient.cpw.base-url=${petclinic.mock.url}/cpw/arcgis/rest/services/CPWSpeciesData/FeatureServer
spring.http.serviceclient.openfda.base-url=${petclinic.mock.url}/openfda
spring.http.serviceclient.usgs.base-url=${petclinic.mock.url}/usgs/fdsnws/event/1
spring.http.serviceclient.nlr.base-url=${petclinic.mock.url}/nlr
