# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# GraphQL
# The endpoint is /graphql. GraphiQL is a browser client for trying queries, at /graphiql
spring.graphql.graphiql.enabled=true
# The largest number of fields one query may select, counted at every level of the query
petclinic.graphql.max-query-complexity=200

# Chat
# The chat in the web pages gets the same three tools as the MCP server below: this folder
# does not exist, so GATool does not read the curated operation files for the chat
gatool.in-process.operations.locations=optional:classpath*:gatool/none/
# The chat model in the local Ollama, pulled with: ollama pull granite4.1:8b
spring.ai.ollama.chat.model=granite4.1:8b
# The Ollama starter brings Reactor Netty, which Spring Boot would then pick for every
# blocking HTTP client. This keeps the JDK client Petclinic used before, which follows
# redirects.
spring.http.clients.imperative.factory=jdk
# Ollama gets one call, so the chat reports at once when Ollama is not running. By default
# Spring AI retries a failed call 10 times, with pauses that grow to 3 minutes.
spring.ai.retry.max-attempts=0

# External services behind the GraphQL schema
# Spring Web Services is here for its client. Petclinic does not serve any SOAP endpoints,
# so the server side, a MessageDispatcherServlet at /services, stays off.
spring.autoconfigure.exclude=org.springframework.boot.webservices.autoconfigure.WebServicesAutoConfiguration
# These are the live URLs. The "mock" profile points them at recorded responses instead,
# see application-mock.properties
petclinic.upstream.connect-timeout=10s
petclinic.upstream.read-timeout=10s
# Each service has a block of its own below, headed with its name
# Denver open data
# The dog parks, the 311 service requests and the business licenses of the City and County
# of Denver, on ArcGIS Online
spring.http.serviceclient.denver.base-url=https://services1.arcgis.com/zdB7qR0BtYrg0Xpl/arcgis/rest/services
spring.http.serviceclient.denver.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.denver.read-timeout=${petclinic.upstream.read-timeout}
# How far from an owner's address to look for dog parks
petclinic.upstream.denver.dog-park-search-radius-in-metres=5000
# Census geocoder
# The geocoder of the US Census Bureau, which turns an address into latitude and longitude
spring.http.serviceclient.census.base-url=https://geocoding.geo.census.gov/geocoder
spring.http.serviceclient.census.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.census.read-timeout=${petclinic.upstream.read-timeout}
# Colorado Department of Public Health and Environment (CDPHE), over SOAP
# The department's ArcGIS Server serves the animals that tested positive in 2017 as a map layer,
# and the yearly disease counts as a standalone table of another map. Both maps are named Layers.
petclinic.upstream.cdphe.animals-url=https://www.cohealthmaps.dphe.state.co.us/arcgis/services/DCEED/ZOONOTIC_SUMMARY_POSITIVE_ANIMALS_2017/MapServer
petclinic.upstream.cdphe.animals-layer-id=0
petclinic.upstream.cdphe.cases-url=https://www.cohealthmaps.dphe.state.co.us/arcgis/services/OPEN_DATA/cdphe_reportable_disease_dataset/MapServer
petclinic.upstream.cdphe.cases-table-id=1
petclinic.upstream.cdphe.map-name=Layers
# National Weather Service
# The forecasts, observations and weather alerts of api.weather.gov. Its more than 50 read
# operations are served by one fetcher from an operation table (nws/operations.json).
# The service answers 403 to a request without a User-Agent that names the application.
petclinic.upstream.nws.url=https://api.weather.gov
petclinic.upstream.nws.user-agent=spring-petclinic-colorado (https://github.com/api-agent-bridge/spring-petclinic-colorado)
# NRCS Air and Water Database
# The SNOTEL snow stations, their readings and the water supply forecasts, served from an
# operation table (awdb/operations.json) like the National Weather Service
petclinic.upstream.awdb.url=https://wcc.sc.egov.usda.gov/awdbRestApi
# iNaturalist
# The read operations are generated into an operation table (inaturalist/operations.json).
# The Swagger file asks callers to stay below 60 requests a minute and 10,000 a day.
petclinic.upstream.inaturalist.url=https://api.inaturalist.org
petclinic.upstream.inaturalist.user-agent=spring-petclinic-colorado (https://github.com/api-agent-bridge/spring-petclinic-colorado)
# National Park Service
# The read operations are generated into an operation table (nps/operations.json). Every call
# needs a free key from api.data.gov. DEMO_KEY answered about ten calls on 12 October 2026
# and then asked to retry ten hours later.
petclinic.upstream.nps.url=https://developer.nps.gov
petclinic.upstream.nps.api-key=${NPS_API_KEY:DEMO_KEY}
# Colorado Division of Water Resources (DWR)
# DWR has 61 read operations, which one fetcher serves from an operation table
# (dwr/operations.json). Without a key DWR allows 1,000 calls and 600,000 rows a day, and a
# free key from the DWR portal raises the limits.
petclinic.upstream.dwr.url=https://dwr.state.co.us/Rest/GET
petclinic.upstream.dwr.api-key=${DWR_API_KEY:}
# The State of Colorado's open data portal, data.colorado.gov
spring.http.serviceclient.colorado.base-url=https://data.colorado.gov
spring.http.serviceclient.colorado.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.colorado.read-timeout=${petclinic.upstream.read-timeout}
# The license register of the Department of Regulatory Agencies
petclinic.upstream.colorado.veterinary-licenses=7s5z-vewr
# The yearly reports of the animal shelters and rescues, one dataset for each year. The
# datasets before 2020 order their columns differently, so they are left out.
petclinic.upstream.colorado.shelter-reports.2020=uwsx-t9fx
petclinic.upstream.colorado.shelter-reports.2021=bn35-a8hy
petclinic.upstream.colorado.shelter-reports.2022=trsh-h2mc
petclinic.upstream.colorado.shelter-reports.2023=4crp-zpa9
petclinic.upstream.colorado.shelter-reports.2024=timh-w9dy
petclinic.upstream.colorado.shelter-reports.2025=wngd-z7w6
# Colorado Parks and Wildlife species data. A point query asks all 313 layers, which takes a
# few seconds, so the read timeout is longer
spring.http.serviceclient.cpw.base-url=https://services5.arcgis.com/ttNGmDvKQA7oeDQ3/arcgis/rest/services/CPWSpeciesData/FeatureServer
spring.http.serviceclient.cpw.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.cpw.read-timeout=30s
# openFDA animal and veterinary adverse events. A free key raises the limit from 1,000 to
# 120,000 requests a day
spring.http.serviceclient.openfda.base-url=https://api.fda.gov
spring.http.serviceclient.openfda.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.openfda.read-timeout=${petclinic.upstream.read-timeout}
petclinic.upstream.openfda.api-key=${OPENFDA_API_KEY:}
# USGS earthquakes. On 12 October 2026 the catalogue took 10 to 42 seconds to answer a
# search it had not seen before, and a fraction of a second for a repeated one, so the read
# timeout is longer
spring.http.serviceclient.usgs.base-url=https://earthquake.usgs.gov/fdsnws/event/1
spring.http.serviceclient.usgs.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.usgs.read-timeout=45s
# NLR Alternative Fuel Stations. DEMO_KEY allows a few calls an hour; a free key from
# developer.nlr.gov/signup allows 1,000
spring.http.serviceclient.nlr.base-url=https://developer.nlr.gov
spring.http.serviceclient.nlr.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.nlr.read-timeout=${petclinic.upstream.read-timeout}
petclinic.upstream.nlr.api-key=${NLR_API_KEY:DEMO_KEY}

# Internationalization
spring.messages.basename=messages/messages

#spring.ai.mcp.server.instructions="For any questions related to pets, vets, or pet products like pet food, pet health, pet clinics or anything related to pets, try using the searchSchema to see if our API can provide any details
# The MCP server, as clients list it
spring.ai.mcp.server.name=petclinic
# What a model reads before its first tool call. Petclinic's text replaces GATool's, so it
# repeats GATool's search, read and run loop after the topics of the API.
spring.ai.mcp.server.instructions=This server answers questions about a pet clinic and about public data on animals, pets, vets, \
  weather, water and the outdoors in Denver, Colorado and the United States. \
  The API holds the clinic's owners, their pets and visits, its vets and pet types, and the Denver dog parks nearest to an owner. \
  It also reads public services: Denver's dog parks, 311 animal cases and kennel licenses; Colorado's veterinary license register \
  and the yearly reports of its animal shelters; animals that tested positive for rabies, plague or tularemia in Colorado (CDPHE); \
  wildlife ranges and human conflict areas of Colorado Parks and Wildlife; adverse drug events in animals (openFDA); \
  community sightings of species (iNaturalist); national parks, their alerts and the things to do with pets (National Park Service); \
  weather forecasts, observations and alerts (National Weather Service); snowpack and water supply forecasts (NRCS); \
  river flows, water rights, wells, dams and climate stations of Colorado (Division of Water Resources); earthquakes (USGS); \
  alternative fuel stations (NLR); and the US Census geocoder, which turns an address into latitude and longitude for the fields that take a point. \
  For a question on any of these topics, search the schema before you decide the API cannot answer it. \
  The three tools let you write GraphQL against the API: search the schema for the fields that answer the question, \
  read any type the search result names that you need to look inside, such as an input type you pass, then run the operation. \
  A refusal names what was wrong: read the types it names and correct the document before running it again.

#spring.ai.mcp.server.protocol= STREAMABLE
# Three tools let the model find its way through the schema and run a query it writes:
# searchSchema, introspectType and executeGraphql
gatool.dev.experimental.generate-tools=dynamic-three-step
# On purpose, the MCP server serves those three tools alone: this folder does not exist, so
# GATool does not read the curated operation files in gatool/mcp
gatool.mcp.operations.locations=optional:classpath*:gatool/none/
# searchSchema ranks the schema's fields by meaning, with a GraphQL-tuned embedding model in
# the local Ollama, pulled and named with:
#   ollama pull hf.co/xthor/Qwen3-Embedding-0.6B-GraphQL:Q8_0
#   ollama cp hf.co/xthor/Qwen3-Embedding-0.6B-GraphQL:Q8_0 qwen3-graphql-embedder
gatool.dev.experimental.dynamic-operations.search-backend=embedding
spring.ai.ollama.embedding.model=qwen3-graphql-embedder
# Tokens of search results one searchSchema call returns. The iNaturalist observation search
# alone costs about 810 tokens, for its 101 arguments.
gatool.dev.experimental.dynamic-operations.search-token-budget=5000
# The embedding model reads a question as "Instruct: <task>\nQuery:<question>", the format
# Qwen3 embedding models are trained with. Schema fields are embedded without an instruction.
gatool.dev.experimental.dynamic-operations.question-prefix=Instruct: Given a question, retrieve the GraphQL schema field that answers it\nQuery:

# Needed for the demoing quickly!!!
gatool.mcp.security.unsafe.allow-mcp-calls-without-authentication=true

# MCP endpoint security
# The endpoint is an OAuth 2.1 resource server. Every call carries an access token from the
# Keycloak realm in keycloak/compose.yaml, and a call without one gets 401 with the address
# of the endpoint's metadata, which names the realm and the scopes to sign in for.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/petclinic
# MCP ties a token to the server it was issued for, named by the endpoint's canonical URL
gatool.mcp.security.resource=http://localhost:8080/mcp
spring.security.oauth2.resourceserver.jwt.audiences=http://localhost:8080/mcp
# Every tool needs mcp:tools. The five write tools also need petclinic:write, which their
# operation files name.
gatool.mcp.security.baseline-scopes=mcp:tools

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE
# Every SOAP envelope the external service clients send and receive
# logging.level.org.springframework.ws.client.MessageTracing.sent=TRACE
# logging.level.org.springframework.ws.client.MessageTracing.received=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h
