# Keycloak, the authorization server of the secured MCP endpoint, at http://localhost:8180
#
# Start it with: docker compose -f keycloak/compose.yaml up -d
# The realm "petclinic" is imported from petclinic-realm.json at the first start.
# The admin console is at http://localhost:8180/admin, with the user admin and the password admin.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # every token names this address as its issuer, whichever address the client used
      KC_HOSTNAME: http://localhost:8180
    volumes:
      - ./petclinic-realm.json:/opt/keycloak/data/import/petclinic-realm.json:ro
